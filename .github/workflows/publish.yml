name: Publish to BCR
on:
  # Run the publish workflow after a successful release
  # Will be triggered from the release.yaml workflow
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  # In case of problems, let release engineers retry by manually dispatching
  # the workflow from the GitHub UI
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string

permissions: {}

jobs:
  publish-bcr:
    name: Publish to BCR via OSS Exit Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Stage BCR release archive to OSS Exit Gate Artifact Registry
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE="rules_android_ndk-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="rules_android_ndk-${VERSION}/" HEAD > "${ARCHIVE}"
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=rules-android-ndk--bcr \
            --package=rules_android_ndk \
            --version="${VERSION}" \
            --source="${ARCHIVE}"

      - name: Trigger OSS Exit Gate release
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "rules_android_ndk",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/rules-android-ndk/bcr/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
